name: Build

# Every push and pull request builds Mesodisk.exe and keeps it as a downloadable artifact.
# Pushing a version tag (e.g. v1.0.0) also publishes a GitHub Release with the portable exe.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags are needed to work out the version

      - name: Build Mesodisk.exe
        shell: powershell
        run: .\build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mesodisk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @($env:GITHUB_REF_NAME) + (Get-ChildItem dist -File).FullName
          $ghArgs += @('--title', "Mesodisk $env:GITHUB_REF_NAME", '--notes-file', 'obj/release-notes.md', '--verify-tag')
          if ($env:GITHUB_REF_NAME -match '-') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
